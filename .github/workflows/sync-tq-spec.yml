name: Sync tq spec

on:
  repository_dispatch:
    types: [tq-spec-updated]
  workflow_dispatch:

permissions:
  id-token: write

concurrency:
  group: sync-tq-spec
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: fohte/spec-sync-action@ec5f1eebb0b16054a38fa04aba4c02b6c09ee9e9 # v0.1.1
        with:
          producer-repo: fohte/tq
          auto-merge: true
          generate-command: |
            corepack enable
            pnpm install --frozen-lockfile
            tq_spec_ref=$(git ls-remote https://github.com/fohte/tq.git refs/heads/main | cut -f1)
            test -n "$tq_spec_ref"
            TQ_SPEC_REF="$tq_spec_ref" pnpm run generate:tq-contract
          octo-sts-identity: webhook-hub-sync-tq-spec
